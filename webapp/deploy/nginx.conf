# nginx 反向代理示例：把 animals.example.com 换成你的域名
# 证书可用 certbot --nginx 自动配置
server {
    listen 80;
    server_name animals.example.com;
    # return 301 https://$host$request_uri;   # 配好 HTTPS 后打开

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 可选：由 nginx 直接发静态卡片，减轻 Python 压力（路径改成服务器上的仓库位置）
    # location /cards/  { alias /opt/AnimalCards/动物/;        expires 7d; add_header Cache-Control "public"; }
    # location /plants/ { alias /opt/AnimalCards/植物/;        expires 7d; add_header Cache-Control "public"; }
    # location /fungi/  { alias /opt/AnimalCards/真菌/;        expires 7d; add_header Cache-Control "public"; }
    # location /thumbs/ { alias /opt/AnimalCards/webapp/thumbs/; expires 7d; add_header Cache-Control "public"; }
}
