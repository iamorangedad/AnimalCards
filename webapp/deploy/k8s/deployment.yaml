apiVersion: apps/v1
kind: Deployment
metadata:
  name: animalcards-globe
  namespace: animalcards
  labels:
    app.kubernetes.io/name: animalcards-globe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: animalcards-globe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: animalcards-globe
    spec:
      containers:
        - name: animalcards
          # 推送到你的仓库后，用 kustomization.yaml 的 images 字段改写
          image: animalcards-globe:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: animalcards-globe
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
